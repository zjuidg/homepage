<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#06070d" />
    <script>
      (() => {
        try {
          if (localStorage.getItem('idg-theme') === 'light') {
            document.documentElement.dataset.theme = 'light';
            document.querySelector('meta[name="theme-color"]').content = '#ffffff';
          }
        } catch {
          // Keep the default theme when storage is unavailable.
        }
      })();
    </script>
    <meta name="description" content="News, talks, and awards from the Zhejiang University Interactive Data Group." />
    <title>News · Interactive Data Group · Zhejiang University</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/news.tsx"></script>
  </body>
</html>
